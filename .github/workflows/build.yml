name: Build and Push

on:
  push:
    branches: [main]
  # Push-to-main was the only trigger, so this workflow could not be exercised
  # anywhere else -- which is how it kept a Nix pin that could not evaluate the
  # flake from 6daf741 until the next push to main three weeks later. Manual
  # dispatch makes it runnable against any branch before it lands.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Same installer as ci.yml, for the same reason: install-nix-action pins
      # Nix 2.19.1, which rejects store path names beginning with a dot and so
      # cannot evaluate this flake -- the pre-commit check has src = ./., which
      # makes .gitignore a store path of its own. This workflow kept the old
      # action after ci.yml was fixed because it only runs on push to main, so
      # the breakage stayed invisible until main was next pushed.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # flake.nix's nixConfig lists four more substituters, but Nix discards
          # them here -- "ignoring untrusted flake configuration setting" -- as
          # the runner is not a trusted user, so a flake cannot redirect its
          # fetches. Declaring them at this level makes them trusted instead.
          # The fastly entry is a CDN mirror of cache.nixos.org and leads the
          # list on purpose: the expensive step is pulling ~7 GiB into an empty
          # store, not compiling. The flake's USTC mirror is deliberately left
          # out, since it serves Asia and these runners are not there.
          # lemonilemon.cachix.org is absent because cachix-action writes it
          # straight into nix.conf, which is already a trusted path.
          extra-conf: |
            substituters = https://aseipp-nix-cache.global.ssl.fastly.net https://cache.nixos.org/ https://nix-community.cachix.org https://cache.numtide.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
            
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: lemonilemon
          # This token allows the action to push newly built configurations to your Cachix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          
      - name: Run checks
        run: nix flake check
        
      - name: Build NixOS-wsl configuration
        run: |
          echo "🔍 Building NixOS-wsl configuration..."
          nix build .#nixosConfigurations.NixOS-wsl.config.system.build.toplevel
          
      - name: Build laptop configuration
        run: |
          echo "🔍 Building laptop configuration..."
          nix build .#nixosConfigurations.laptop.config.system.build.toplevel
          
      - name: Build desktop configuration
        run: |
          echo "🔍 Building desktop configuration..."
          nix build .#nixosConfigurations.desktop.config.system.build.toplevel
