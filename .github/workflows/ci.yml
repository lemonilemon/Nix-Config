name: Nix Checker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs current Nix rather than a version frozen at the action's
      # release date. install-nix-action pinned Nix 2.19.1, which rejects store
      # path names beginning with a dot and so could not evaluate this flake.
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: lemonilemon
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Run checks
        run: nix flake check
      - name: Check formatting
        run: |
          nix fmt
          if ! git diff --quiet; then
            echo "❌ Code is not formatted properly"
            echo "Run 'nix fmt' locally and commit the changes"
            git diff
            exit 1
          fi
      - name: Dry build NixOS-wsl configuration
        run: |
          echo "🔍 Dry building NixOS-wsl configuration..."
          nix build .#nixosConfigurations.NixOS-wsl.config.system.build.toplevel --dry-run
      - name: Dry build laptop configuration
        run: |
          echo "🔍 Dry building laptop configuration..."
          nix build .#nixosConfigurations.laptop.config.system.build.toplevel --dry-run
      - name: Dry build desktop configuration
        run: |
          echo "🔍 Dry building desktop configuration..."
          nix build .#nixosConfigurations.desktop.config.system.build.toplevel --dry-run
