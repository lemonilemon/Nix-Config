name: "Flake.lock: update Nix dependencies"
on:
  # Manual trigger: Actions → Flake.lock: update Nix dependencies → Run workflow.
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # runs weekly on Sunday at 00:00
jobs:
  nix-flake-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Scheduled workflows are loaded from main, but updates belong in the
      # active integration branch.
      - uses: actions/checkout@v6
        with:
          ref: dev
      - uses: DeterminateSystems/determinate-nix-action@v3
      # Pinned rather than tracking main: this job holds contents: write,
      # pull-requests: write and a PAT, so it should not run whatever happens to
      # be on someone else's default branch. Dependabot bumps the pin.
      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          base: dev
          branch: automation/flake-updates
          commit-msg: "chore: update flake inputs"
          pr-title: "chore: update flake inputs"
          pr-labels: |
            dependencies
            automated
